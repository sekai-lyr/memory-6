spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sekai_friend?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:20070831}

server.port=${SERVER_PORT:8086}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SEKAI_COOKIE_SECURE:false}

mybatis.mapper-locations=classpath*:com.sekai.game2048.mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

sekai.ads.enabled=${SEKAI_ADS_ENABLED:false}
sekai.ads.client=${SEKAI_ADS_CLIENT:}
sekai.ads.slot=${SEKAI_ADS_SLOT:}

sekai.checkout.plus-url=${SEKAI_PLUS_CHECKOUT_URL:}
sekai.checkout.pack-url=${SEKAI_PACK_CHECKOUT_URL:}
sekai.checkout.sponsor-url=${SEKAI_SPONSOR_CHECKOUT_URL:}

sekai.admin.token=${SEKAI_ADMIN_TOKEN:}

# Session timeout - 2 hours (in case of inactivity)
server.servlet.session.timeout=120m
server.servlet.session.cookie.max-age=7200
# Unique cookie name to avoid conflicts between projects
server.servlet.session.cookie.name=JSESSIONID_M6

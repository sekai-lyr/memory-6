<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai 2048 - 登录</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>
<main class="auth-page">
    <section class="brand-panel" aria-labelledby="brand-title">
        <div class="brand-content">
            <div class="brand-topline">
                <span class="brand-mark" aria-hidden="true">2048</span>
                <span class="brand-context">角色合成游戏</span>
            </div>
            <p class="eyebrow">深夜角色棋盘</p>
            <h1 id="brand-title">Sekai <strong>2048</strong></h1>
            <p class="brand-lede">合成相同角色，解锁更高阶的伙伴，在一间有星光的游戏房间里冲到 2048。</p>
            <ul class="brand-points" aria-label="游戏特色">
                <li><strong>角色卡面</strong><span>原创角色合成</span></li>
                <li><strong>多种棋盘</strong><span>按你的节奏挑战</span></li>
                <li><strong>成绩记录</strong><span>随时回来继续</span></li>
            </ul>
        </div>
    </section>

    <section class="auth-panel">
        <div class="auth-card">
            <div class="card-head">
                <div class="access-tag">
                    <span class="tag-mark">2048</span>
                    <span>玩家登录</span>
                </div>
                <h2>欢迎回来</h2>
                <p>登录后继续你的角色合成挑战。</p>
            </div>

            <div class="server-message success" role="status" th:if="${message}" th:text="${message}"></div>
            <div class="server-message error" role="alert" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/user/login}" action="/user/login" method="post">
                <label class="field">
                    <span>用户名</span>
                    <input id="userName" type="text" name="userName" placeholder="请输入用户名或昵称" autocomplete="username" required>
                </label>
                <label class="field">
                    <span>密码</span>
                    <div class="input-wrap">
                        <input id="password" type="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
                        <button class="password-toggle" id="passwordToggle" type="button" aria-controls="password" aria-pressed="false">显示</button>
                    </div>
                </label>
                <div class="form-actions">
                    <button class="primary-btn" type="submit"><span data-submit-label>登录</span></button>
                    <a class="ghost-btn" th:href="@{/register}" href="/register">创建新账号</a>
                </div>
            </form>
            <p class="auth-note">登录后可以保存成绩，查看排行榜和继续挑战。</p>
            <p class="legal-links">
                登录即代表同意
                <a th:href="@{/terms}" href="/terms">服务条款</a>
                和
                <a th:href="@{/privacy}" href="/privacy">隐私政策</a>
            </p>
        </div>
    </section>
</main>
<script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
</body>
</html>
